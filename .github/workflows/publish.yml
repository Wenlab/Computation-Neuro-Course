on:
  push:
    branches:
      - Course-Homepage
  workflow_dispatch:

name: Render and Publish Quarto Site

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Show environment
        run: |
          quarto --version
          git config user.name || true
          git config user.email || true
          echo "GITHUB_TOKEN write test:"
          git ls-remote origin | head -3 || echo "ls-remote FAILED"

      - name: Render Quarto project
        run: quarto render .

      - name: Show render output
        run: ls -la _site/ && ls -la _site/images/

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
